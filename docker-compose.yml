# Local development stack: observability services plus opt-in extras.
#
#   docker compose up -d                                 # observability only
#   docker compose --profile datastores up -d            # + example Postgres
#   docker compose --profile buffering up -d             # + Redpanda buffer
#   docker compose --profile datastores --profile buffering up -d   # everything
#
# Credentials below are defaults for local development only. Override them
# with environment variables (or a git-ignored .env file) and never reuse them
# in a deployed environment. Published ports bind to 127.0.0.1 so the services
# are not reachable from other machines on the network.
#
# Credential variables only take effect the first time a service initializes
# its persistent data directory under ./data/. Changing them later has no
# effect on existing data. To rotate or reset credentials, stop the service and
# delete its data directory (data/grafana_data/ for Grafana, data/postgres_data/
# for Postgres), then start it again. Deleting the directory erases its data.

services:
  # ----------------------------------------------------
  # Centralized Event Streaming / Observability
  # ----------------------------------------------------
  loki:
    image: grafana/loki:3.3.2
    environment:
      - TZ=UTC
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./data/loki_data:/loki
      - ./config/loki/local-config.yaml:/etc/loki/local-config.yaml:ro

  promtail:
    image: grafana/promtail:3.3.2
    environment:
      - TZ=UTC
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Host log scraping assumes a Linux host (see config/promtail/docker-config.yaml).
      - /var/log:/var/log
      - ./config/promtail/docker-config.yaml:/etc/promtail/docker-config.yaml:ro
    command: -config.file=/etc/promtail/docker-config.yaml

  prometheus:
    image: prom/prometheus:v3.1.0
    environment:
      - TZ=UTC
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./data/prometheus_data:/prometheus
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      - TZ=UTC
      # Local development only: override via environment or .env.
      # Applied on first initialization of data/grafana_data/ only; to change
      # them later, stop grafana and delete data/grafana_data/.
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data/grafana_data:/var/lib/grafana
    depends_on:
      - loki
      - prometheus

  # ----------------------------------------------------
  # OPTIONAL: high-throughput log buffering
  # ----------------------------------------------------
  # Redpanda (Kafka-compatible) is not wired into the pipeline by default:
  # Promtail pushes straight to Loki. Start it with
  # `docker compose --profile buffering up` when log volume needs a buffer.
  # Its Prometheus scrape job is commented out in
  # config/prometheus/prometheus.yml; uncomment it when enabling this profile.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.2
    profiles: ["buffering"]
    environment:
      - TZ=UTC
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --pandaproxy-addr 0.0.0.0:8082
      - --advertise-pandaproxy-addr localhost:8082
    ports:
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:8082:8082"
      - "127.0.0.1:9092:9092"
      - "127.0.0.1:29092:29092"
    volumes:
      - ./data/redpanda_data:/var/lib/redpanda/data

  # ----------------------------------------------------
  # OPTIONAL: example datastores
  # ----------------------------------------------------
  # Example only: remove or replace these per your database ADR
  # (resources/architecture/ADRs/). Opt-in: start them with
  # `docker compose --profile datastores up`.
  postgres:
    image: postgres:16-alpine
    profiles: ["datastores"]
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - TZ=UTC
      # Local development only: override via environment or .env.
      # Applied on first initialization of data/postgres_data/ only; to change
      # them later, stop postgres and delete data/postgres_data/.
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./data/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Example search index. Uncomment if your ADRs call for Elasticsearch.
  # elasticsearch:
  #   image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
  #   profiles: ["datastores"]
  #   environment:
  #     - TZ=UTC
  #     - discovery.type=single-node
  #     # Local development only: security is disabled.
  #     - xpack.security.enabled=false
  #     - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
  #   ports:
  #     - "127.0.0.1:9200:9200"
  #   volumes:
  #     - ./data/es_data:/usr/share/elasticsearch/data
